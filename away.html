<!doctype html>
<html lang="en" data-theme="away">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Away</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; cursor: default; }
  body.no-pointer, body.no-pointer * { cursor: none !important; }

  /* macOS blurs the screen behind this window. A soft plum tint on top evens it out, so the note
     reads the same over a white document or a dark video. */
  .tint { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(43, 39, 51, 0.16), rgba(43, 39, 51, 0.38)); }

  /* Gradient blobs: big, very soft, slow. They drift so the screen feels asleep, not frozen. */
  .blobs { position: fixed; inset: 0; overflow: hidden; }
  .blob {
    position: absolute; width: 62vmax; height: 62vmax; left: var(--x); top: var(--y); margin: -31vmax 0 0 -31vmax;
    border-radius: 50%; background: radial-gradient(closest-side, var(--c), transparent);
    opacity: 0.44; filter: blur(40px); will-change: transform;
    animation: drift var(--t) ease-in-out infinite alternate; animation-delay: var(--delay);
  }
  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(var(--dx), var(--dy)) scale(1.12); }
    100% { transform: translate(calc(var(--dx) * -0.6), calc(var(--dy) * 0.8)) scale(0.94); }
  }

  /* The note: the same chunky card as the settings window. */
  .stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 40px; }
  .card {
    max-width: 620px; padding: 34px 46px 30px; border-radius: 34px; text-align: center;
    background: var(--card); box-shadow: 0 9px 0 var(--card-lip), 0 30px 80px rgba(22, 19, 28, 0.28);
    animation: card-in 720ms var(--bouncy) both; animation-delay: 120ms;
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(18px) scale(0.82); } }
  .card .cup { display: block; margin: 0 auto 18px; }
  .card .cup svg { display: block; margin: 0 auto; }
  .cup .steam path { stroke-dasharray: 14; animation: steam 2.8s ease-in-out infinite; }
  .cup .steam .s2 { animation-delay: 1.1s; }
  .cup .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
  .cup .twinkle.t2 { animation-delay: 1.4s; }
  @keyframes twinkle { 50% { opacity: 0.45; transform: scale(0.72) rotate(18deg); } }
  .cup .dots circle { animation: hop 1.6s ease-in-out infinite; }
  .cup .dots .d2 { animation-delay: 0.18s; }
  .cup .dots .d3 { animation-delay: 0.36s; }
  @keyframes hop { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-2.5px); } }
  @keyframes steam { 0% { stroke-dashoffset: 14; opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { stroke-dashoffset: -14; opacity: 0; } }
  .msg { font-size: 34px; line-height: 1.18; font-weight: 800; letter-spacing: -0.015em; margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
  .since { display: inline-flex; align-items: center; gap: 8px; margin: 18px 0 0; padding: 6px 14px; border-radius: 999px; background: var(--well); color: var(--ink-2); font-size: 15px; font-weight: 700; }
  .since .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--peach-lip)); animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.35; transform: scale(0.8); } }
  .since[hidden] { display: none; }

  /* A reminder of how to come back, shown for a moment on the screen you were looking at. */
  .hint {
    position: fixed; left: 50%; bottom: 44px; translate: -50% 0; padding: 9px 16px; border-radius: 999px;
    background: rgba(251, 248, 243, 0.88); box-shadow: 0 4px 0 rgba(228, 219, 206, 0.9); color: var(--ink); font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity 600ms ease, transform 600ms var(--smooth);
    transform: translateY(10px);
  }
  .hint.show { opacity: 1; transform: none; }
  .hint kbd { font: inherit; font-weight: 800; background: var(--card); box-shadow: 0 2px 0 var(--card-lip); border-radius: 6px; padding: 0 6px; }

  body.leaving .card { animation: card-out 220ms cubic-bezier(.5, 0, .9, .4) forwards; }
  @keyframes card-out { to { opacity: 0; transform: scale(0.92); } }

  @media (prefers-reduced-motion: reduce) {
    .blob, .cup .steam path, .cup .twinkle, .cup .dots circle, .since .dot { animation: none; }
    .card { animation-duration: 1ms; }
  }
</style>
</head>
<body>
<div class="tint"></div>
<div class="blobs" id="blobs"></div>
<div class="stage">
  <div class="card" role="status" aria-live="polite">
    <span class="cup" id="cup"></span>
    <p class="msg" id="msg"></p>
    <p class="since" id="since" hidden><span class="dot"></span><span id="sinceText"></span></p>
  </div>
</div>
<div class="hint" id="hint"></div>
<script src="tools.js"></script>
<script src="away-screen.js"></script>
</body>
</html>
