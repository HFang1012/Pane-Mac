<!doctype html>
<html lang="en" data-theme="tweak">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' data: blob:">
<title>Tweak</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Tweak's editor: a workbench. The file lies on an indigo cutting mat in the middle; the tools for its kind
     are on the right; the bottom bar says what saving will do, and does it. Everything that acts
     or marks is the same chartreuse as Tweak's pointer: the crop box, the trim brackets, Save, sliders. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-rows: 52px 1fr auto; background: var(--paper); color: var(--ink); font-family: var(--font);
    font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; cursor: default;
    --mat: #262950; --mat-2: #2E3260; --mat-line: rgba(255, 255, 255, 0.055); --mat-line-2: rgba(255, 255, 255, 0.1);
    --act: #CDEB5A; --act-lip: #9CBD27; --act-soft: #EEF8C9; --act-ink: #4E6800; /* the selection's chartreuse */
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  button:focus { outline: none; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2.5px solid var(--act-lip); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- title bar ---------- */
  .bar { -webkit-app-region: drag; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 14px; border-bottom: 1px solid var(--edge); background: var(--paper); }
  .bar > * { -webkit-app-region: no-drag; }
  .bar .g { display: inline-flex; -webkit-app-region: drag; }
  /* Window buttons: Pane's own, in place of macOS's traffic lights. Two chunky keys in a well, the same
     shape as the rest of the bar. Close warms to rose on hover; hide just lifts. */
  .wbtns { display: inline-flex; gap: 4px; padding: 3px; margin-right: 4px; border-radius: 11px; background: var(--well); }
  .wbtn { width: 26px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2);
    transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease, transform 200ms var(--bouncy); }
  .wbtn svg { width: 12px; height: 12px; }
  .wbtn:hover { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--card-lip); }
  .wbtn.x:hover { background: #F7D3DC; color: #8A2343; box-shadow: 0 2px 0 #E3A5B5; }
  .wbtn:active { transform: translateY(1px) scale(0.94); box-shadow: none; }
  body.blurred .wbtns { opacity: 0.6; }
  .title { display: flex; align-items: baseline; min-width: 0; padding: 3px 4px 3px 9px; border-radius: 9px; transition: background 140ms ease; }
  .title:hover, .title:focus-within { background: var(--well); }
  .title input { border: 0; background: none; outline: none; font-size: 14px; font-weight: 800; padding: 0; min-width: 1ch; max-width: 360px; field-sizing: content; }
  .title .ext { font-size: 14px; font-weight: 800; color: var(--ink-2); padding-right: 6px; }
  .chip { font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: var(--well); border-radius: 7px; padding: 2px 8px; white-space: nowrap; }
  .dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--act-lip); opacity: 0; transition: opacity 200ms ease; }
  .dirty.on { opacity: 1; }
  .grow { flex: 1; -webkit-app-region: drag; align-self: stretch; }
  .ibtn { height: 30px; min-width: 30px; padding: 0 8px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); font-weight: 700; transition: background 140ms ease, color 140ms ease, transform 200ms var(--bouncy); }
  .ibtn:hover { background: var(--well); color: var(--ink); }
  .ibtn:active { transform: scale(0.93); }
  .ibtn:disabled { opacity: 0.35; pointer-events: none; }
  .ibtn svg { width: 17px; height: 17px; }
  .ibtn.del:hover { background: #F7D3DC; color: #8A2343; }

  /* ---------- the workbench ---------- */
  main { display: grid; grid-template-columns: 1fr 296px; min-height: 0; }
  .stage {
    position: relative; min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-rows: 1fr auto;
    background-color: var(--mat);
    background-image:
      linear-gradient(var(--mat-line-2) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line-2) 1px, transparent 1px),
      linear-gradient(var(--mat-line) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    background-position: -1px -1px;
  }
  .stage.texty { background: var(--card); }
  .canvas-wrap { position: relative; min-height: 0; display: grid; place-items: center; padding: 34px; }
  .frame { position: relative; line-height: 0; box-shadow: 0 18px 40px -16px rgba(5, 6, 20, 0.7); transition: transform 360ms var(--smooth); }
  .frame canvas, .frame video { display: block; max-width: 100%; }
  .checker { background-color: #fff; background-image: linear-gradient(45deg, #E6E7F2 25%, transparent 25%, transparent 75%, #E6E7F2 75%), linear-gradient(45deg, #E6E7F2 25%, transparent 25%, transparent 75%, #E6E7F2 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }

  /* The crop box: the rest dims, chartreuse corner marks to drag, thirds while you move it. */
  .crop { position: absolute; inset: 0; pointer-events: none; }
  .crop.live { pointer-events: auto; }
  .crop .box { position: absolute; box-shadow: 0 0 0 9999px rgba(18, 19, 42, 0.62); outline: 1.5px solid rgba(205, 235, 90, 0.9); cursor: move; }
  .crop:not(.live) .box { outline-color: transparent; cursor: default; }
  .crop .box::before, .crop .box::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 160ms ease;
    background: linear-gradient(90deg, transparent calc(33.33% - 0.5px), rgba(255,255,255,0.45) 33.33%, transparent calc(33.33% + 0.5px), transparent calc(66.66% - 0.5px), rgba(255,255,255,0.45) 66.66%, transparent calc(66.66% + 0.5px)); }
  .crop .box::after { background: linear-gradient(transparent calc(33.33% - 0.5px), rgba(255,255,255,0.45) 33.33%, transparent calc(33.33% + 0.5px), transparent calc(66.66% - 0.5px), rgba(255,255,255,0.45) 66.66%, transparent calc(66.66% + 0.5px)); }
  .crop.moving .box::before, .crop.moving .box::after { opacity: 1; }
  .crop .h { position: absolute; width: 22px; height: 22px; border: 0 solid var(--accent); filter: drop-shadow(0 1.5px 0 var(--accent-lip)); }
  .crop:not(.live) .h { display: none; }
  .crop .h[data-h="nw"] { left: -5px; top: -5px; border-width: 4px 0 0 4px; cursor: nwse-resize; border-top-left-radius: 5px; }
  .crop .h[data-h="ne"] { right: -5px; top: -5px; border-width: 4px 4px 0 0; cursor: nesw-resize; border-top-right-radius: 5px; }
  .crop .h[data-h="sw"] { left: -5px; bottom: -5px; border-width: 0 0 4px 4px; cursor: nesw-resize; border-bottom-left-radius: 5px; }
  .crop .h[data-h="se"] { right: -5px; bottom: -5px; border-width: 0 4px 4px 0; cursor: nwse-resize; border-bottom-right-radius: 5px; }
  .crop .e { position: absolute; }
  .crop .e[data-h="n"], .crop .e[data-h="s"] { left: 22px; right: 22px; height: 12px; cursor: ns-resize; }
  .crop .e[data-h="n"] { top: -6px; } .crop .e[data-h="s"] { bottom: -6px; }
  .crop .e[data-h="w"], .crop .e[data-h="e"] { top: 22px; bottom: 22px; width: 12px; cursor: ew-resize; }
  .crop .e[data-h="w"] { left: -6px; } .crop .e[data-h="e"] { right: -6px; }
  .crop .dims { position: absolute; left: 50%; bottom: -30px; translate: -50% 0; font-size: 11.5px; font-weight: 800; color: #ECEDFB; background: rgba(18, 19, 42, 0.86); padding: 3px 9px; border-radius: 7px; white-space: nowrap; line-height: 1.4; font-variant-numeric: tabular-nums; }
  .crop:not(.live) .dims { display: none; }

  /* Pictures: the result on the mat, scrolling when zoomed in; frames down the left, markup tools on top. */
  .imgstage { display: grid; grid-template-columns: 1fr; min-height: 0; }
  .imgstage.multi { grid-template-columns: 132px 1fr; }
  .viewport { position: relative; min-width: 0; min-height: 0; display: grid; }
  .viewport .frame canvas { max-width: none; }
  .viewport .canvas-wrap { overflow: auto; place-items: safe center; padding: 62px 34px 58px; }
  .canvas-wrap[data-tool="select"] canvas { cursor: crosshair; }
  .canvas-wrap[data-tool="pen"] canvas { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="1.6" stroke-linejoin="round"><path d="M4 20l1.2-4.6L16 4.6a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/></svg>') 2 20, crosshair; }
  .canvas-wrap[data-tool="erase"] canvas { cursor: cell; }
  .frames { min-height: 0; display: grid; grid-template-rows: auto 1fr; background: rgba(14, 15, 36, 0.45); border-right: 1px solid rgba(255,255,255,0.06); color: #ECEDFB; }
  .fhead { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 6px 12px; font-size: 11.5px; }
  .fhead b { font-weight: 800; color: #A6A9CF; }
  .fplay { width: 28px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,0.1); color: #ECEDFB; }
  .fplay:hover { background: rgba(255,255,255,0.18); }
  .fplay svg { width: 12px; height: 12px; }
  .flist { overflow-y: auto; padding: 4px 10px 14px; display: grid; align-content: start; gap: 6px; }
  .fr { display: grid; justify-items: center; gap: 4px; padding: 7px 6px 6px; border-radius: 10px; transition: background 120ms ease; }
  .fr:hover { background: rgba(255,255,255,0.07); }
  .fr canvas { max-width: 96px; max-height: 72px; image-rendering: auto; background: repeating-conic-gradient(#3A3E6E 0 25%, #30345F 0 50%) 0 0 / 10px 10px; border-radius: 3px; box-shadow: 0 4px 10px -4px rgba(5,6,20,0.6); }
  .fr .fn { font-size: 10.5px; font-weight: 800; color: #A6A9CF; font-variant-numeric: tabular-nums; }
  .fr.on { background: color-mix(in srgb, var(--act) 22%, transparent); box-shadow: inset 0 0 0 2px var(--act); }
  .fr.on .fn { color: var(--act); }
  .mtools { position: absolute; top: 12px; left: 50%; translate: -50% 0; z-index: 3; display: flex; gap: 6px; align-items: center; padding: 5px; border-radius: 14px;
    background: rgba(14, 15, 36, 0.78); backdrop-filter: blur(10px); box-shadow: 0 10px 24px -10px rgba(5,6,20,0.7); color: #ECEDFB; transition: opacity 160ms ease; }
  .mtools.off { opacity: 0.35; pointer-events: none; }
  .tgroup { display: flex; gap: 2px; }
  .tgroup + .tgroup { padding-left: 6px; border-left: 1px solid rgba(255,255,255,0.12); }
  .mtools button { height: 30px; min-width: 30px; border-radius: 9px; display: grid; place-items: center; color: #C9CBEA; transition: background 120ms ease, color 120ms ease, transform 200ms var(--bouncy); }
  .mtools button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .mtools button:active { transform: scale(0.92); }
  .mtools button svg { width: 17px; height: 17px; }
  .mtools [data-tool].on { background: var(--act); color: var(--ink); box-shadow: inset 0 -2px 0 var(--act-lip); }
  .colors button i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.35); }
  .colors button.on { background: rgba(255,255,255,0.14); }
  .colors button.on i { box-shadow: 0 0 0 2px var(--act); }
  .sizes button i { width: var(--d); height: var(--d); border-radius: 50%; background: currentColor; }
  .sizes button.on { background: rgba(255,255,255,0.14); color: var(--act); }
  .mtools .tevery { padding: 0 9px; font-size: 11.5px; font-weight: 800; }
  .mtools .tevery.on { background: rgba(205,235,90,0.2); color: var(--act); }
  .zoom { position: absolute; right: 14px; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 11px; background: rgba(14, 15, 36, 0.78); backdrop-filter: blur(10px); color: #ECEDFB; }
  .zoom button { height: 26px; min-width: 26px; border-radius: 8px; font-size: 15px; font-weight: 800; color: #C9CBEA; }
  .zoom button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .zoom .zl { min-width: 76px; padding: 0 8px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  /* The picked box: marching ants, its size, and what you can do with it. */
  /* The picked box, in Tweak's chartreuse: green-and-ink marching ants over a faint green wash, green handles. */
  .sel { position: absolute; z-index: 2; cursor: move; touch-action: none; background-color: rgba(205, 235, 90, 0.12);
    background-image: linear-gradient(90deg, var(--act) 50%, #1B1D3A 50%), linear-gradient(90deg, var(--act) 50%, #1B1D3A 50%), linear-gradient(0deg, var(--act) 50%, #1B1D3A 50%), linear-gradient(0deg, var(--act) 50%, #1B1D3A 50%);
    background-repeat: repeat-x, repeat-x, repeat-y, repeat-y; background-size: 10px 2px, 10px 2px, 2px 10px, 2px 10px; background-position: 0 0, 0 100%, 0 0, 100% 0; animation: ants 600ms linear infinite; }
  @keyframes ants { to { background-position: 10px 0, -10px 100%, 0 -10px, 100% 10px; } }
  .sel .sh { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 4px; background: var(--act); box-shadow: 0 0 0 2px #1B1D3A, 0 2px 0 2px var(--act-lip); z-index: 1; transition: transform 160ms var(--bouncy); }
  .sel .sh:hover { transform: scale(1.25); }
  .sel .sh[data-h="nw"] { left: 0; top: 0; cursor: nwse-resize; } .sel .sh[data-h="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
  .sel .sh[data-h="sw"] { left: 0; top: 100%; cursor: nesw-resize; } .sel .sh[data-h="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
  .sel .se { position: absolute; }
  .sel .se[data-h="n"], .sel .se[data-h="s"] { left: 8px; right: 8px; height: 10px; cursor: ns-resize; }
  .sel .se[data-h="n"] { top: -5px; } .sel .se[data-h="s"] { bottom: -5px; }
  .sel .se[data-h="w"], .sel .se[data-h="e"] { top: 8px; bottom: 8px; width: 10px; cursor: ew-resize; }
  .sel .se[data-h="w"] { left: -5px; } .sel .se[data-h="e"] { right: -5px; }
  .selbar { position: absolute; left: 50%; top: calc(100% + 16px); translate: -50% 0; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(14, 15, 36, 0.92); white-space: nowrap; line-height: 1.4; cursor: default; box-shadow: 0 0 0 1.5px rgba(205, 235, 90, 0.35), 0 8px 18px -8px rgba(5,6,20,0.7); }
  .selbar::before { content: attr(data-dims); align-self: center; padding: 0 8px 0 6px; font-size: 11px; font-weight: 800; color: var(--act); font-variant-numeric: tabular-nums; }
  .selbar .sb { height: 24px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; font-weight: 800; color: #ECEDFB; }
  .selbar .sb:hover { background: rgba(205, 235, 90, 0.2); color: var(--act); }
  .selbar .sb:first-of-type { background: var(--act); color: var(--ink); box-shadow: inset 0 -2px 0 var(--act-lip); }
  .selbar .sb:first-of-type:hover { filter: brightness(1.06); color: var(--ink); }
  .sel.dragging .selbar { display: none; }
  .sel.bar-up .selbar { top: auto; bottom: calc(100% + 16px); }
  .sel.bar-in .selbar { top: auto; bottom: 14px; }
  /* Compress: how hard to squeeze, and what it comes to. */
  .compress .pct { font-size: 11.5px; font-weight: 800; color: var(--act-ink); background: var(--act-soft); border-radius: 6px; padding: 1px 7px; }
  .compress .pct:empty { display: none; }
  .compress .pct.worse { color: #8A2343; background: #F7D3DC; }
  .compress .est { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .compress .est b { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; transition: opacity 160ms ease; }
  .compress.busy .est b { opacity: 0.45; font-size: 13px; }
  .compress .est span { font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
  .compress .meter { height: 8px; border-radius: 4px; background: var(--well); overflow: hidden; }
  .compress .meter i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--act); box-shadow: inset 0 -2px 0 var(--act-lip); transition: width 420ms var(--smooth); }
  .compress .meter.worse i { background: #E4789A; box-shadow: none; }

  /* Audio: the waveform on the mat. */
  .wave-wrap { position: relative; width: 100%; height: 100%; display: grid; align-content: center; gap: 18px; padding: 30px 44px; }
  .wave-wrap canvas { width: 100%; height: 220px; display: block; }
  .wave-title { color: #ECEDFB; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .wave-title svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .wave-title small { color: #A6A9CF; font-weight: 700; font-size: 12px; }

  /* ---------- timeline: video and sound ---------- */
  .timeline { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 12px 18px 14px; background: rgba(14, 15, 36, 0.5); color: #ECEDFB; }
  .play { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: #ECEDFB; color: var(--ink); box-shadow: inset 0 -3px 0 #B9BCDD; transition: transform 200ms var(--bouncy); }
  .play:active { transform: scale(0.92); }
  .play svg { width: 16px; height: 16px; margin-top: -2px; }
  .track { position: relative; height: 46px; border-radius: 10px; background: rgba(255,255,255,0.06); overflow: visible; cursor: pointer; }
  .strip { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; display: flex; }
  .strip canvas { height: 100%; flex: 1; min-width: 0; object-fit: cover; opacity: 0.85; }
  .strip.bars canvas { opacity: 1; }
  .out-l, .out-r { position: absolute; top: 0; bottom: 0; background: rgba(14, 15, 36, 0.68); pointer-events: none; }
  .out-l { left: 0; border-radius: 10px 0 0 10px; } .out-r { right: 0; border-radius: 0 10px 10px 0; }
  .trim { position: absolute; top: -5px; bottom: -5px; width: 14px; cursor: ew-resize; touch-action: none; }
  .trim::before { content: ""; position: absolute; top: 0; bottom: 0; width: 10px; border: 4px solid var(--accent); filter: drop-shadow(0 1.5px 0 var(--accent-lip)); }
  .trim.l { margin-left: -4px; } .trim.l::before { left: 0; border-right: 0; border-radius: 6px 0 0 6px; }
  .trim.r { margin-left: -10px; } .trim.r::before { right: 0; border-left: 0; border-radius: 0 6px 6px 0; }
  .head { position: absolute; top: -8px; bottom: -8px; width: 2px; margin-left: -1px; background: #fff; border-radius: 1px; pointer-events: none; box-shadow: 0 0 0 1px rgba(14,15,36,0.4); }
  .head::before { content: ""; position: absolute; top: -2px; left: -4px; width: 10px; height: 10px; border-radius: 3px; background: #fff; }
  .clock { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; color: #A6A9CF; white-space: nowrap; min-width: 118px; text-align: right; }
  .clock b { color: #ECEDFB; }

  /* ---------- text ---------- */
  .text-wrap { position: relative; min-height: 0; display: grid; grid-template-columns: auto 1fr; overflow: hidden; }
  .text-wrap.split { grid-template-columns: auto 1fr 1fr; }
  .gutter { padding: 18px 10px 18px 16px; text-align: right; color: #A9ADCB; font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; white-space: pre; background: var(--well); border-right: 1px solid var(--edge); font-variant-numeric: tabular-nums; }
  textarea#text {
    border: 0; outline: none; resize: none; padding: 18px 22px; margin: 0; background: var(--card); color: var(--ink); tab-size: 2;
    font: 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre; overflow: auto; user-select: text; caret-color: var(--act-ink);
  }
  textarea#text.wrap { white-space: pre-wrap; }
  textarea#text.prose { font: 15px/1.65 var(--font); padding: 26px 34px; }
  .text-wrap.prose .gutter { display: none; }
  textarea#text::selection { background: var(--act-soft); }
  mark.find { background: none; }
  .preview { border-left: 1px solid var(--edge); background: #fff; overflow: auto; }
  .preview iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .textbar { display: flex; gap: 16px; align-items: center; padding: 7px 16px; border-top: 1px solid var(--edge); background: var(--well); color: var(--ink-2); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .textbar .grow { -webkit-app-region: no-drag; }

  /* ---------- the inspector ---------- */
  .panel { border-left: 1px solid var(--edge); background: var(--paper); overflow-y: auto; padding: 14px 14px 20px; display: grid; align-content: start; gap: 12px; }
  .group { background: var(--card); border-radius: 16px; box-shadow: 0 3px 0 var(--card-lip); padding: 12px 14px 14px; display: grid; gap: 10px;
    animation: card-in 460ms var(--smooth) both; animation-delay: calc(80ms + var(--i, 0) * 45ms); }
  @keyframes card-in { from { opacity: 0; transform: translateX(14px); } }
  .group h3 { margin: 0; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .group h3 .link { font-size: 11.5px; color: var(--act-ink); font-weight: 800; }
  .group h3 .link:hover { text-decoration: underline; }
  .group p.note { margin: 0; font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row.fill > * { flex: 1; }
  .row.tight { flex-wrap: nowrap; gap: 4px; } .row.tight > .tbtn { padding: 0 4px; min-width: 0; }
  .tbtn {
    height: 32px; padding: 0 10px; border-radius: 10px; background: var(--well); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    transition: background 140ms ease, transform 200ms var(--bouncy), box-shadow 160ms ease;
  }
  .tbtn:hover { background: var(--paper-deep); }
  .tbtn:active { transform: scale(0.95); }
  .tbtn svg { width: 16px; height: 16px; flex: none; }
  .tbtn.on { background: var(--ink); color: #F1F2FC; }
  .tbtn.sm { height: 28px; padding: 0 9px; font-size: 11.5px; border-radius: 8px; }
  .tbtn.go { background: var(--act); color: var(--ink); box-shadow: inset 0 -3px 0 var(--act-lip); }
  .tbtn.go:hover { filter: brightness(1.06); }
  .tbtn:disabled { opacity: 0.4; pointer-events: none; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .slider label { font-size: 12px; font-weight: 700; }
  .slider output { font-size: 11.5px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .slider input { grid-column: 1 / -1; width: 100%; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 22px; background: none; margin: 0; }
  input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--act) var(--p, 50%), var(--well) var(--p, 50%)); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--act-lip), 0 2px 4px rgba(12,13,31,0.25); transition: transform 160ms var(--bouncy); }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 11px; font-weight: 800; color: var(--ink-2); }
  .num, .txt { height: 32px; border-radius: 9px; border: 0; background: var(--well); padding: 0 10px; font-size: 12.5px; font-weight: 700; width: 100%; outline: none; font-variant-numeric: tabular-nums; user-select: text; }
  .num:focus, .txt:focus { box-shadow: inset 0 0 0 2px var(--act-lip); }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: end; }
  .lock { width: 28px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); }
  .lock.on { color: var(--act-ink); }
  .lock svg { width: 16px; height: 16px; }
  .switchline { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; }
  .sw { width: 38px; height: 22px; border-radius: 11px; background: var(--edge); position: relative; transition: background 200ms ease; flex: none; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(12,13,31,0.3); transition: translate 260ms var(--bouncy); }
  .sw[aria-checked="true"] { background: var(--act); }
  .sw[aria-checked="true"]::after { translate: 16px 0; }
  .count { font-size: 11.5px; font-weight: 800; color: var(--accent-ink); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; }
  .count:empty { display: none; }

  /* ---------- save bar ---------- */
  .save { display: grid; grid-template-columns: auto auto 1fr auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--edge); background: var(--card); }
  .fmt { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--ink-2); }
  .select { position: relative; }
  /* The type menu: Pane's own, not macOS's. A button like the other wells; its list rises out of the save bar. */
  .pick { height: 34px; padding: 0 30px 0 12px; border-radius: 10px; border: 0; background: var(--well); font-size: 13px; font-weight: 800; color: var(--ink); cursor: pointer; white-space: nowrap; transition: background 140ms ease; }
  .pick:hover, .pick[aria-expanded="true"] { background: color-mix(in srgb, var(--well) 80%, var(--ink) 8%); }
  .select:has(.pick[aria-expanded="true"])::after { rotate: 225deg; top: 15px; }
  .select::after { transition: rotate 200ms var(--bouncy), top 200ms var(--bouncy); }
  .fmenu {
    position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 30; min-width: 100%; width: max-content; max-height: min(420px, 70vh); overflow: auto;
    padding: 6px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--edge), 0 4px 0 var(--card-lip), 0 18px 40px -12px rgba(20, 24, 60, .35);
    transform-origin: 24px 100%; animation: fmenu-in 260ms var(--bouncy);
  }
  @keyframes fmenu-in { from { opacity: 0; transform: translateY(6px) scale(.94); } }
  .fmenu .opt {
    display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px 0 8px; border: 0; border-radius: 9px; background: none;
    font-size: 13px; font-weight: 700; color: var(--ink); text-align: left; cursor: pointer; outline: none; white-space: nowrap;
  }
  .fmenu .opt:hover, .fmenu .opt:focus-visible, .fmenu .opt:focus { background: var(--well); }
  .fmenu .opt .tick { width: 14px; flex: none; color: var(--ink); opacity: 0; }
  .fmenu .opt[aria-selected="true"] .tick { opacity: 1; }
  .fmenu .opt[aria-selected="true"] { background: color-mix(in srgb, var(--act) 55%, transparent); }
  .fmenu .opt .nm { flex: 1; }
  .fmenu .opt .tag { font-size: 11px; font-weight: 800; color: var(--ink-2); background: var(--well); border-radius: 6px; padding: 1px 6px; }
  .fmenu .opt[aria-selected="true"] .tag { background: color-mix(in srgb, var(--card) 70%, transparent); }
  .fmenu .opt .end { margin-left: 14px; font: 700 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-2); }
  .fmenu hr { border: 0; height: 1px; background: var(--edge); margin: 5px 6px; }
  .select::after { content: ""; position: absolute; right: 12px; top: 13px; width: 6px; height: 6px; border: solid var(--ink-2); border-width: 0 2px 2px 0; rotate: 45deg; pointer-events: none; }
  .seg { position: relative; display: inline-flex; padding: 3px; border-radius: 11px; background: var(--well); }
  .seg button { position: relative; z-index: 1; height: 28px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 800; color: var(--ink-2); transition: color 160ms ease; }
  .seg button[aria-checked="true"] { color: var(--ink); }
  .seg .thumb { position: absolute; top: 3px; height: 28px; border-radius: 8px; background: var(--card); box-shadow: 0 2px 0 var(--card-lip); transition: left 340ms var(--bouncy), width 340ms var(--bouncy); }
  .what { font-size: 12px; font-weight: 600; color: var(--ink-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .what b { color: var(--ink); font-weight: 800; }
  .savebtn {
    position: relative; overflow: hidden; height: 38px; padding: 0 20px; border-radius: 12px; background: var(--act); color: var(--ink); font-size: 13.5px; font-weight: 800;
    box-shadow: inset 0 -4px 0 var(--act-lip); display: inline-flex; align-items: center; gap: 8px; min-width: 132px; justify-content: center;
    transition: transform 220ms var(--bouncy), filter 160ms ease;
  }
  .savebtn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .savebtn:active { transform: translateY(1px); }
  .savebtn .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(27,29,58,0.14); transition: width 240ms ease; }
  .savebtn.busy { pointer-events: none; }
  .savebtn span { position: relative; }
  .savebtn:disabled { opacity: 0.5; pointer-events: none; }

  /* ---------- after saving, and when something goes wrong ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 76px; translate: -50% 20px; opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 12px;
    padding: 9px 10px 9px 14px; border-radius: 14px; background: var(--ink); color: #ECEDFB; font-weight: 700; font-size: 12.5px;
    box-shadow: 0 4px 0 #0C0D1F, 0 18px 34px -12px rgba(12,13,31,0.55); transition: translate 380ms var(--bouncy), opacity 200ms ease; z-index: 10; max-width: 80vw;
  }
  .toast.on { translate: -50% 0; opacity: 1; pointer-events: auto; }
  .toast.err { background: #7A2440; box-shadow: 0 4px 0 #4E1328, 0 18px 34px -12px rgba(12,13,31,0.55); }
  .toast .tk { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--accent); color: var(--ink); flex: none; }
  .toast.err .tk { background: #FFB3C4; }
  .toast span.m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast button { height: 28px; padding: 0 10px; border-radius: 9px; background: rgba(255,255,255,0.12); font-weight: 800; font-size: 12px; white-space: nowrap; }
  .toast button:hover { background: rgba(255,255,255,0.2); }

  .empty { display: grid; place-items: center; text-align: center; color: #ECEDFB; padding: 40px; }
  .empty h2 { margin: 14px 0 6px; font-size: 20px; }
  .empty p { margin: 0 0 18px; color: #A6A9CF; font-weight: 600; }
  /* A typed ending, beside Save as. */
  .endwrap { position: relative; display: inline-flex; align-items: center; }
  .endwrap::before { content: "."; position: absolute; left: 10px; font-weight: 800; color: var(--ink-2); pointer-events: none; }
  .endwrap:has([hidden])::before { display: none; }
  .txt.end { width: 104px; height: 34px; padding-left: 18px; font-weight: 800; animation: pop-in 320ms var(--bouncy); }
  .txt.end.bad { box-shadow: inset 0 0 0 2px #E3A5B5; }
  @keyframes pop-in { from { opacity: 0; transform: translateX(-6px) scale(0.94); } }

  /* ---------- a folder: Finder's four views on a light card ---------- */
  .stage.foldery { background: var(--card); grid-template-rows: auto 1fr auto; }
  .fbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--edge); background: var(--paper); }
  .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
  .crumb { height: 28px; padding: 0 8px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .crumb:hover { background: var(--well); color: var(--ink); }
  .crumb.here { color: var(--ink); font-weight: 800; }
  .crumbs .sep svg { width: 12px; height: 12px; color: var(--edge); display: block; }
  .vseg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--well); }
  .vseg button { width: 34px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease; }
  .vseg button svg { width: 16px; height: 16px; }
  .vseg button:hover { color: var(--ink); }
  .vseg button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--card-lip); }
  .fview { min-height: 0; overflow: auto; }
  .fview.enter { animation: settle 520ms var(--smooth) both; }
  .fstatus { padding: 6px 16px; border-top: 1px solid var(--edge); background: var(--well); color: var(--ink-2); font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fempty { height: 100%; display: grid; place-content: center; justify-items: center; gap: 8px; color: var(--ink-2); }
  .fempty svg { width: 46px; height: 46px; }
  .fview img { opacity: 0; transition: opacity 200ms ease; object-fit: contain; }
  .fview img.in, .panel img.in { opacity: 1; }
  .fview .on { background: var(--act-soft); }
  /* icons */
  .v-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); align-content: start; gap: 6px; padding: 16px; }
  .icon { display: grid; justify-items: center; gap: 6px; padding: 10px 6px 8px; border-radius: 12px; transition: background 120ms ease; }
  .icon:hover { background: var(--well); }
  .icon .th { width: 72px; height: 72px; }
  .icon .nm { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.25; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; padding: 1px 5px; border-radius: 5px; }
  .icon.on { background: none; }
  .icon.on .th { background: var(--well); border-radius: 8px; }
  .icon.on .nm { background: var(--act); color: var(--ink); }
  /* list */
  .table { display: grid; }
  .tr { display: grid; grid-template-columns: minmax(180px, 2.4fr) 1.4fr 0.7fr 1fr; gap: 12px; align-items: center; padding: 0 16px; height: 30px; text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .tr > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr:nth-child(odd):not(.th) { background: color-mix(in srgb, var(--well) 60%, transparent); }
  .tr.th { position: sticky; top: 0; z-index: 1; height: 28px; background: var(--card); border-bottom: 1px solid var(--edge); font-size: 11.5px; font-weight: 800; cursor: default; }
  .tr .nm { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 700; }
  .tr .ic, .cr .ic { width: 20px; height: 20px; flex: none; }
  .tr.on, .tr.on:nth-child(odd) { background: var(--act); }
  .tr.on > span { color: var(--ink); }
  /* columns */
  .v-columns { overflow: hidden; }
  .cols { display: flex; height: 100%; overflow-x: auto; scroll-behavior: smooth; }
  .col { flex: none; width: 230px; border-right: 1px solid var(--edge); overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 1px; }
  .cr { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 7px; text-align: left; font-size: 12.5px; font-weight: 700; flex: none; }
  .cr:hover { background: var(--well); }
  .cr .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cr i svg { width: 12px; height: 12px; color: var(--ink-2); display: block; }
  .cr.on { background: var(--act); }
  .cempty { margin: 10px; color: var(--ink-2); font-weight: 700; font-size: 12px; }
  .col.preview { width: 280px; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 20px; }
  .col.preview .big { width: 190px; height: 190px; }
  .col.preview b { font-size: 13px; overflow-wrap: anywhere; }
  .col.preview small { color: var(--ink-2); font-weight: 700; }
  /* gallery */
  .v-gallery { display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  .hero { display: grid; grid-template-rows: 1fr auto; min-height: 0; padding: 18px 18px 8px; background: var(--mat); }
  .hero .pic { min-height: 0; display: grid; place-items: center; }
  .hero .big { max-width: 100%; max-height: 100%; width: 100%; height: 100%; filter: drop-shadow(0 18px 30px rgba(5, 6, 20, 0.5)); }
  .hero .cap { display: grid; justify-items: center; padding-top: 10px; color: #ECEDFB; }
  .hero .cap b { font-size: 14px; }
  .hero .cap small { color: #A6A9CF; font-weight: 700; font-size: 11.5px; }
  .strip2 { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; background: var(--paper); border-top: 1px solid var(--edge); }
  .strip2 .g { flex: none; width: 68px; height: 68px; border-radius: 10px; display: grid; place-items: center; padding: 6px; transition: background 120ms ease, transform 200ms var(--bouncy); }
  .strip2 .g:hover { background: var(--well); }
  .strip2 .g.on { background: var(--act); transform: translateY(-2px); }
  .strip2 .g img { width: 100%; height: 100%; }
  /* inspector bits */
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 12px; }
  .facts dt { color: var(--ink-2); font-weight: 700; }
  .facts dd { margin: 0; font-weight: 800; text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .facts dd.where { color: var(--act-ink); cursor: pointer; font-weight: 700; }
  .facts dd.where:hover { text-decoration: underline; }
  .kbar { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12px; font-weight: 700; }
  .kbar .kn { color: var(--ink-2); font-weight: 800; font-variant-numeric: tabular-nums; }
  .kbar i { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; }
  .kbar b { display: block; height: 100%; border-radius: 3px; background: var(--act); transition: width 600ms var(--smooth); }
  .kbar.k-image b { background: #E4789A; } .kbar.k-video b { background: #5567E3; } .kbar.k-audio b { background: #B9A5F4; } .kbar.k-other b { background: var(--edge); }
  .pickrow { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; }
  .pickrow .pt { width: 52px; height: 52px; object-fit: contain; opacity: 0; transition: opacity 200ms ease; }
  .pickrow b { display: block; font-size: 12.5px; overflow-wrap: anywhere; }
  .pickrow small { color: var(--ink-2); font-weight: 700; font-size: 11.5px; }

  .drop { position: fixed; inset: 10px; border-radius: 18px; border: 3px dashed var(--accent); background: rgba(38, 41, 80, 0.55); display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity 160ms ease; z-index: 20; }
  .drop.on { opacity: 1; }

  /* One reveal: the file settles onto the mat. */
  .frame.enter, .wave-wrap.enter { animation: settle 620ms var(--smooth) both; }
  @keyframes settle { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<header class="bar">
  <span class="wbtns">
    <button class="wbtn x" id="winClose" title="Close (⌘W)" aria-label="Close"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l6 6M9 3 3 9"/></svg></button>
    <button class="wbtn" id="winHide" title="Hide (⌘M)" aria-label="Hide"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 6h7"/></svg></button>
  </span>
  <span class="g" id="glyph"></span>
  <label class="title" title="Rename"><input id="stem" spellcheck="false" aria-label="File name"><span class="ext" id="ext"></span></label>
  <span class="dirty" id="dirty" title="Changed, not saved"></span>
  <span class="chip" id="chip"></span>
  <span class="grow"></span>
  <button class="ibtn" id="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ibtn" id="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button class="ibtn" id="reveal" title="Show in Finder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.5l2 2.5H18a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19.5H6A2.5 2.5 0 0 1 3.5 17z"/></svg></button>
  <button class="ibtn del" id="trash" title="Move to the Trash" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5l1-12.5"/><path d="M10 11v6M14 11v6"/></svg></button>
  <button class="ibtn" id="open" title="Open another file">Open…</button>
</header>
<main>
  <section class="stage" id="stage"></section>
  <aside class="panel" id="panel" aria-label="Tools"></aside>
</main>
<footer class="save" id="savebar">
  <div class="fmt"><span>Save as</span><span class="select"><select id="format" aria-label="File type" hidden tabindex="-1"></select><button class="pick" id="formatBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="File type"><span id="formatLabel"></span></button><div class="fmenu" id="formatMenu" role="listbox" aria-label="File type" hidden></div></span><span class="endwrap"><input class="txt end" id="ending" placeholder="ending" spellcheck="false" maxlength="15" aria-label="Ending to save with" hidden></span></div>
  <div class="seg" id="mode" role="radiogroup" aria-label="Save over the original or keep it">
    <span class="thumb"></span>
    <button role="radio" data-mode="replace">Replace original</button>
    <button role="radio" data-mode="copy">Save a copy</button>
  </div>
  <div class="what" id="what"></div>
  <button class="savebtn" id="save"><i class="bar-fill" id="fill"></i><span id="saveText">Save</span></button>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="tk" id="toastIcon"></span><span class="m" id="toastMsg"></span><button id="toastBtn" hidden>Show in Finder</button></div>
<div class="drop" id="drop">Drop to open it here</div>
<script src="tools.js"></script>
<script src="edit.js"></script>
</body>
</html>
