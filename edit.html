<!doctype html>
<html lang="en" data-theme="tweak">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' data: blob:">
<title>Tweak</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Tweak's editor: a workbench. The file lies on an indigo cutting mat in the middle; the tools for its kind
     are on the right; the bottom bar says what saving will do, and does it. Everything that acts
     or marks is the same chartreuse as Tweak's pointer: the crop box, the trim brackets, Save, sliders. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-rows: 52px 1fr auto; background: var(--paper); color: var(--ink); font-family: var(--font);
    font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; cursor: default;
    --mat: #262950; --mat-2: #2E3260; --mat-line: rgba(255, 255, 255, 0.055); --mat-line-2: rgba(255, 255, 255, 0.1);
    --act: #CDEB5A; --act-lip: #9CBD27; --act-soft: #EEF8C9; --act-ink: #4E6800; /* the selection's chartreuse */
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  button:focus { outline: none; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2.5px solid var(--act-lip); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- title bar ---------- */
  .bar { -webkit-app-region: drag; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 86px; border-bottom: 1px solid var(--edge); background: var(--paper); }
  .bar > * { -webkit-app-region: no-drag; }
  .bar .g { display: inline-flex; -webkit-app-region: drag; }
  .title { display: flex; align-items: baseline; min-width: 0; padding: 3px 4px 3px 9px; border-radius: 9px; transition: background 140ms ease; }
  .title:hover, .title:focus-within { background: var(--well); }
  .title input { border: 0; background: none; outline: none; font-size: 14px; font-weight: 800; padding: 0; min-width: 1ch; max-width: 360px; field-sizing: content; }
  .title .ext { font-size: 14px; font-weight: 800; color: var(--ink-2); padding-right: 6px; }
  .chip { font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: var(--well); border-radius: 7px; padding: 2px 8px; white-space: nowrap; }
  .dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--act-lip); opacity: 0; transition: opacity 200ms ease; }
  .dirty.on { opacity: 1; }
  .grow { flex: 1; -webkit-app-region: drag; align-self: stretch; }
  .ibtn { height: 30px; min-width: 30px; padding: 0 8px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); font-weight: 700; transition: background 140ms ease, color 140ms ease, transform 200ms var(--bouncy); }
  .ibtn:hover { background: var(--well); color: var(--ink); }
  .ibtn:active { transform: scale(0.93); }
  .ibtn:disabled { opacity: 0.35; pointer-events: none; }
  .ibtn svg { width: 17px; height: 17px; }

  /* ---------- the workbench ---------- */
  main { display: grid; grid-template-columns: 1fr 296px; min-height: 0; }
  .stage {
    position: relative; min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-rows: 1fr auto;
    background-color: var(--mat);
    background-image:
      linear-gradient(var(--mat-line-2) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line-2) 1px, transparent 1px),
      linear-gradient(var(--mat-line) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    background-position: -1px -1px;
  }
  .stage.texty { background: var(--card); }
  .canvas-wrap { position: relative; min-height: 0; display: grid; place-items: center; padding: 34px; }
  .frame { position: relative; line-height: 0; box-shadow: 0 18px 40px -16px rgba(5, 6, 20, 0.7); transition: transform 360ms var(--smooth); }
  .frame canvas, .frame video { display: block; max-width: 100%; }
  .checker { background-color: #fff; background-image: linear-gradient(45deg, #E6E7F2 25%, transparent 25%, transparent 75%, #E6E7F2 75%), linear-gradient(45deg, #E6E7F2 25%, transparent 25%, transparent 75%, #E6E7F2 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }

  /* The crop box: the rest dims, chartreuse corner marks to drag, thirds while you move it. */
  .crop { position: absolute; inset: 0; pointer-events: none; }
  .crop.live { pointer-events: auto; }
  .crop .box { position: absolute; box-shadow: 0 0 0 9999px rgba(18, 19, 42, 0.62); outline: 1.5px solid rgba(205, 235, 90, 0.9); cursor: move; }
  .crop:not(.live) .box { outline-color: transparent; cursor: default; }
  .crop .box::before, .crop .box::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 160ms ease;
    background: linear-gradient(90deg, transparent calc(33.33% - 0.5px), rgba(255,255,255,0.45) 33.33%, transparent calc(33.33% + 0.5px), transparent calc(66.66% - 0.5px), rgba(255,255,255,0.45) 66.66%, transparent calc(66.66% + 0.5px)); }
  .crop .box::after { background: linear-gradient(transparent calc(33.33% - 0.5px), rgba(255,255,255,0.45) 33.33%, transparent calc(33.33% + 0.5px), transparent calc(66.66% - 0.5px), rgba(255,255,255,0.45) 66.66%, transparent calc(66.66% + 0.5px)); }
  .crop.moving .box::before, .crop.moving .box::after { opacity: 1; }
  .crop .h { position: absolute; width: 22px; height: 22px; border: 0 solid var(--accent); filter: drop-shadow(0 1.5px 0 var(--accent-lip)); }
  .crop:not(.live) .h { display: none; }
  .crop .h[data-h="nw"] { left: -5px; top: -5px; border-width: 4px 0 0 4px; cursor: nwse-resize; border-top-left-radius: 5px; }
  .crop .h[data-h="ne"] { right: -5px; top: -5px; border-width: 4px 4px 0 0; cursor: nesw-resize; border-top-right-radius: 5px; }
  .crop .h[data-h="sw"] { left: -5px; bottom: -5px; border-width: 0 0 4px 4px; cursor: nesw-resize; border-bottom-left-radius: 5px; }
  .crop .h[data-h="se"] { right: -5px; bottom: -5px; border-width: 0 4px 4px 0; cursor: nwse-resize; border-bottom-right-radius: 5px; }
  .crop .e { position: absolute; }
  .crop .e[data-h="n"], .crop .e[data-h="s"] { left: 22px; right: 22px; height: 12px; cursor: ns-resize; }
  .crop .e[data-h="n"] { top: -6px; } .crop .e[data-h="s"] { bottom: -6px; }
  .crop .e[data-h="w"], .crop .e[data-h="e"] { top: 22px; bottom: 22px; width: 12px; cursor: ew-resize; }
  .crop .e[data-h="w"] { left: -6px; } .crop .e[data-h="e"] { right: -6px; }
  .crop .dims { position: absolute; left: 50%; bottom: -30px; translate: -50% 0; font-size: 11.5px; font-weight: 800; color: #ECEDFB; background: rgba(18, 19, 42, 0.86); padding: 3px 9px; border-radius: 7px; white-space: nowrap; line-height: 1.4; font-variant-numeric: tabular-nums; }
  .crop:not(.live) .dims { display: none; }

  /* Audio: the waveform on the mat. */
  .wave-wrap { position: relative; width: 100%; height: 100%; display: grid; align-content: center; gap: 18px; padding: 30px 44px; }
  .wave-wrap canvas { width: 100%; height: 220px; display: block; }
  .wave-title { color: #ECEDFB; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .wave-title svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .wave-title small { color: #A6A9CF; font-weight: 700; font-size: 12px; }

  /* ---------- timeline: video and sound ---------- */
  .timeline { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 12px 18px 14px; background: rgba(14, 15, 36, 0.5); color: #ECEDFB; }
  .play { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: #ECEDFB; color: var(--ink); box-shadow: inset 0 -3px 0 #B9BCDD; transition: transform 200ms var(--bouncy); }
  .play:active { transform: scale(0.92); }
  .play svg { width: 16px; height: 16px; margin-top: -2px; }
  .track { position: relative; height: 46px; border-radius: 10px; background: rgba(255,255,255,0.06); overflow: visible; cursor: pointer; }
  .strip { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; display: flex; }
  .strip canvas { height: 100%; flex: 1; min-width: 0; object-fit: cover; opacity: 0.85; }
  .strip.bars canvas { opacity: 1; }
  .out-l, .out-r { position: absolute; top: 0; bottom: 0; background: rgba(14, 15, 36, 0.68); pointer-events: none; }
  .out-l { left: 0; border-radius: 10px 0 0 10px; } .out-r { right: 0; border-radius: 0 10px 10px 0; }
  .trim { position: absolute; top: -5px; bottom: -5px; width: 14px; cursor: ew-resize; touch-action: none; }
  .trim::before { content: ""; position: absolute; top: 0; bottom: 0; width: 10px; border: 4px solid var(--accent); filter: drop-shadow(0 1.5px 0 var(--accent-lip)); }
  .trim.l { margin-left: -4px; } .trim.l::before { left: 0; border-right: 0; border-radius: 6px 0 0 6px; }
  .trim.r { margin-left: -10px; } .trim.r::before { right: 0; border-left: 0; border-radius: 0 6px 6px 0; }
  .head { position: absolute; top: -8px; bottom: -8px; width: 2px; margin-left: -1px; background: #fff; border-radius: 1px; pointer-events: none; box-shadow: 0 0 0 1px rgba(14,15,36,0.4); }
  .head::before { content: ""; position: absolute; top: -2px; left: -4px; width: 10px; height: 10px; border-radius: 3px; background: #fff; }
  .clock { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; color: #A6A9CF; white-space: nowrap; min-width: 118px; text-align: right; }
  .clock b { color: #ECEDFB; }

  /* ---------- text ---------- */
  .text-wrap { position: relative; min-height: 0; display: grid; grid-template-columns: auto 1fr; overflow: hidden; }
  .text-wrap.split { grid-template-columns: auto 1fr 1fr; }
  .gutter { padding: 18px 10px 18px 16px; text-align: right; color: #A9ADCB; font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; white-space: pre; background: var(--well); border-right: 1px solid var(--edge); font-variant-numeric: tabular-nums; }
  textarea#text {
    border: 0; outline: none; resize: none; padding: 18px 22px; margin: 0; background: var(--card); color: var(--ink); tab-size: 2;
    font: 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre; overflow: auto; user-select: text; caret-color: var(--act-ink);
  }
  textarea#text.wrap { white-space: pre-wrap; }
  textarea#text.prose { font: 15px/1.65 var(--font); padding: 26px 34px; }
  .text-wrap.prose .gutter { display: none; }
  textarea#text::selection { background: var(--act-soft); }
  mark.find { background: none; }
  .preview { border-left: 1px solid var(--edge); background: #fff; overflow: auto; }
  .preview iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .textbar { display: flex; gap: 16px; align-items: center; padding: 7px 16px; border-top: 1px solid var(--edge); background: var(--well); color: var(--ink-2); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .textbar .grow { -webkit-app-region: no-drag; }

  /* ---------- the inspector ---------- */
  .panel { border-left: 1px solid var(--edge); background: var(--paper); overflow-y: auto; padding: 14px 14px 20px; display: grid; align-content: start; gap: 12px; }
  .group { background: var(--card); border-radius: 16px; box-shadow: 0 3px 0 var(--card-lip); padding: 12px 14px 14px; display: grid; gap: 10px;
    animation: card-in 460ms var(--smooth) both; animation-delay: calc(80ms + var(--i, 0) * 45ms); }
  @keyframes card-in { from { opacity: 0; transform: translateX(14px); } }
  .group h3 { margin: 0; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .group h3 .link { font-size: 11.5px; color: var(--act-ink); font-weight: 800; }
  .group h3 .link:hover { text-decoration: underline; }
  .group p.note { margin: 0; font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row.fill > * { flex: 1; }
  .tbtn {
    height: 32px; padding: 0 10px; border-radius: 10px; background: var(--well); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    transition: background 140ms ease, transform 200ms var(--bouncy), box-shadow 160ms ease;
  }
  .tbtn:hover { background: var(--paper-deep); }
  .tbtn:active { transform: scale(0.95); }
  .tbtn svg { width: 16px; height: 16px; flex: none; }
  .tbtn.on { background: var(--ink); color: #F1F2FC; }
  .tbtn.sm { height: 28px; padding: 0 9px; font-size: 11.5px; border-radius: 8px; }
  .tbtn.go { background: var(--act); color: var(--ink); box-shadow: inset 0 -3px 0 var(--act-lip); }
  .tbtn.go:hover { filter: brightness(1.06); }
  .tbtn:disabled { opacity: 0.4; pointer-events: none; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .slider label { font-size: 12px; font-weight: 700; }
  .slider output { font-size: 11.5px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .slider input { grid-column: 1 / -1; width: 100%; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 22px; background: none; margin: 0; }
  input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--act) var(--p, 50%), var(--well) var(--p, 50%)); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--act-lip), 0 2px 4px rgba(12,13,31,0.25); transition: transform 160ms var(--bouncy); }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 11px; font-weight: 800; color: var(--ink-2); }
  .num, .txt { height: 32px; border-radius: 9px; border: 0; background: var(--well); padding: 0 10px; font-size: 12.5px; font-weight: 700; width: 100%; outline: none; font-variant-numeric: tabular-nums; user-select: text; }
  .num:focus, .txt:focus { box-shadow: inset 0 0 0 2px var(--act-lip); }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: end; }
  .lock { width: 28px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); }
  .lock.on { color: var(--act-ink); }
  .lock svg { width: 16px; height: 16px; }
  .switchline { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; }
  .sw { width: 38px; height: 22px; border-radius: 11px; background: var(--edge); position: relative; transition: background 200ms ease; flex: none; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(12,13,31,0.3); transition: translate 260ms var(--bouncy); }
  .sw[aria-checked="true"] { background: var(--act); }
  .sw[aria-checked="true"]::after { translate: 16px 0; }
  .count { font-size: 11.5px; font-weight: 800; color: var(--accent-ink); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; }
  .count:empty { display: none; }

  /* ---------- save bar ---------- */
  .save { display: grid; grid-template-columns: auto auto 1fr auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--edge); background: var(--card); }
  .fmt { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--ink-2); }
  .select { position: relative; }
  .select select { -webkit-appearance: none; appearance: none; height: 34px; padding: 0 30px 0 12px; border-radius: 10px; border: 0; background: var(--well); font-size: 13px; font-weight: 800; color: var(--ink); cursor: pointer; outline: none; }
  .select::after { content: ""; position: absolute; right: 12px; top: 13px; width: 6px; height: 6px; border: solid var(--ink-2); border-width: 0 2px 2px 0; rotate: 45deg; pointer-events: none; }
  .seg { position: relative; display: inline-flex; padding: 3px; border-radius: 11px; background: var(--well); }
  .seg button { position: relative; z-index: 1; height: 28px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 800; color: var(--ink-2); transition: color 160ms ease; }
  .seg button[aria-checked="true"] { color: var(--ink); }
  .seg .thumb { position: absolute; top: 3px; height: 28px; border-radius: 8px; background: var(--card); box-shadow: 0 2px 0 var(--card-lip); transition: left 340ms var(--bouncy), width 340ms var(--bouncy); }
  .what { font-size: 12px; font-weight: 600; color: var(--ink-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .what b { color: var(--ink); font-weight: 800; }
  .savebtn {
    position: relative; overflow: hidden; height: 38px; padding: 0 20px; border-radius: 12px; background: var(--act); color: var(--ink); font-size: 13.5px; font-weight: 800;
    box-shadow: inset 0 -4px 0 var(--act-lip); display: inline-flex; align-items: center; gap: 8px; min-width: 132px; justify-content: center;
    transition: transform 220ms var(--bouncy), filter 160ms ease;
  }
  .savebtn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .savebtn:active { transform: translateY(1px); }
  .savebtn .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(27,29,58,0.14); transition: width 240ms ease; }
  .savebtn.busy { pointer-events: none; }
  .savebtn span { position: relative; }
  .savebtn:disabled { opacity: 0.5; pointer-events: none; }

  /* ---------- after saving, and when something goes wrong ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 76px; translate: -50% 20px; opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 12px;
    padding: 9px 10px 9px 14px; border-radius: 14px; background: var(--ink); color: #ECEDFB; font-weight: 700; font-size: 12.5px;
    box-shadow: 0 4px 0 #0C0D1F, 0 18px 34px -12px rgba(12,13,31,0.55); transition: translate 380ms var(--bouncy), opacity 200ms ease; z-index: 10; max-width: 80vw;
  }
  .toast.on { translate: -50% 0; opacity: 1; pointer-events: auto; }
  .toast.err { background: #7A2440; box-shadow: 0 4px 0 #4E1328, 0 18px 34px -12px rgba(12,13,31,0.55); }
  .toast .tk { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--accent); color: var(--ink); flex: none; }
  .toast.err .tk { background: #FFB3C4; }
  .toast span.m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast button { height: 28px; padding: 0 10px; border-radius: 9px; background: rgba(255,255,255,0.12); font-weight: 800; font-size: 12px; white-space: nowrap; }
  .toast button:hover { background: rgba(255,255,255,0.2); }

  .empty { display: grid; place-items: center; text-align: center; color: #ECEDFB; padding: 40px; }
  .empty h2 { margin: 14px 0 6px; font-size: 20px; }
  .empty p { margin: 0 0 18px; color: #A6A9CF; font-weight: 600; }
  .drop { position: fixed; inset: 10px; border-radius: 18px; border: 3px dashed var(--accent); background: rgba(38, 41, 80, 0.55); display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity 160ms ease; z-index: 20; }
  .drop.on { opacity: 1; }

  /* One reveal: the file settles onto the mat. */
  .frame.enter, .wave-wrap.enter { animation: settle 620ms var(--smooth) both; }
  @keyframes settle { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<header class="bar">
  <span class="g" id="glyph"></span>
  <label class="title" title="Rename"><input id="stem" spellcheck="false" aria-label="File name"><span class="ext" id="ext"></span></label>
  <span class="dirty" id="dirty" title="Changed, not saved"></span>
  <span class="chip" id="chip"></span>
  <span class="grow"></span>
  <button class="ibtn" id="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ibtn" id="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button class="ibtn" id="reveal" title="Show in Finder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h3.5l2 2.5H18a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19.5H6A2.5 2.5 0 0 1 3.5 17z"/></svg></button>
  <button class="ibtn" id="open" title="Open another file">Open…</button>
</header>
<main>
  <section class="stage" id="stage"></section>
  <aside class="panel" id="panel" aria-label="Tools"></aside>
</main>
<footer class="save" id="savebar">
  <div class="fmt"><span>Save as</span><span class="select"><select id="format" aria-label="File type"></select></span></div>
  <div class="seg" id="mode" role="radiogroup" aria-label="Save over the original or keep it">
    <span class="thumb"></span>
    <button role="radio" data-mode="replace">Replace original</button>
    <button role="radio" data-mode="copy">Save a copy</button>
  </div>
  <div class="what" id="what"></div>
