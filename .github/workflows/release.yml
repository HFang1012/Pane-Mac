# Builds Pane and publishes a GitHub release whenever a version tag (v1.2.3) is pushed.
# The website's download button always points at the newest release, so it updates by itself.
#
# Release a new version with:  npm run ship        (1.0.1 → 1.0.2)
#                         or:  npm run ship:minor  (1.0.2 → 1.1.0)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # or run it by hand from the Actions tab, for an existing tag
    inputs:
      tag:
        description: 'Tag to build, for example v1.2.3'
        required: true

permissions:
  contents: write # to create the release and upload Pane.dmg

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15 # Apple silicon, matching the Macs Pane is built for
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # full history and tags, so the build can read its version from the tag

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Signed with Pane's own certificate (see scripts/package.js), so an update keeps the permissions
      # you gave the last version. The build stops rather than ship an ad-hoc signed Pane.
      - name: Build Pane.app and Pane.dmg
        env:
          PANE_SIGN_P12: ${{ secrets.PANE_SIGN_P12 }}
          PANE_SIGN_PASSWORD: ${{ secrets.PANE_SIGN_PASSWORD }}
          PANE_SIGN_REQUIRED: '1'
        run: npm run release

      - name: Check it's signed as Pane
        run: |
          codesign -dr - build/Pane.app 2>&1 | tee /dev/stderr | grep -q 'certificate leaf = H"1351e7dc4049217b68344cd5f3d313de433d612c"' \
            || { echo "::error::Pane.app isn't signed with the Pane Signing certificate"; exit 1; }

      - name: Check the version matches the tag
        run: |
          built=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Pane.app/Contents/Info.plist)
          echo "Built version $built for tag $TAG"
          [ "v$built" = "$TAG" ] || { echo "::error::Built $built but the tag is $TAG"; exit 1; }

      # The notes are this version's commit titles. Pane shows them in its update prompt as the changelog.
      - name: Write the changelog
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          git log --no-merges --format='- %s' "$range" | grep -v -E '^- Release [0-9]' > notes.md || true
          [ -s notes.md ] || echo '- Small fixes and improvements' > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release already exists (made by hand, or a re-run): replace its download.
            gh release upload "$TAG" build/Pane.dmg --clobber
          else
            gh release create "$TAG" build/Pane.dmg --title "Pane ${TAG#v}" --notes-file notes.md --latest
          fi
