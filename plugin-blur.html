<!doctype html>
<html lang="en" data-theme="plugin">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Focus</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Focus mode's blur. The window itself is the blur (vibrancy); this page only tints it a little and, on
     screens other than the app's, says what you're focused on. Clicks pass straight through. */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: rgba(36, 31, 46, 0.18); font-family: var(--font); -webkit-font-smoothing: antialiased; user-select: none; }
  body.desk { background: rgba(36, 31, 46, 0.1); }
  .chip {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%; display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px;
    border-radius: 20px; background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--card-lip), 0 18px 34px -12px rgba(17, 14, 23, 0.5);
    font-size: 14px; font-weight: 800; animation: in 520ms var(--bouncy) both 120ms;
  }
  .chip i { width: 26px; height: 26px; border-radius: 9px; background: var(--accent); box-shadow: 0 3px 0 var(--accent-lip); display: grid; place-items: center; }
  .chip i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
  @keyframes in { from { opacity: 0; transform: scale(0.85) translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .chip { animation: none; } }
</style>
</head>
<body>
<div class="chip" id="chip" hidden><i></i><span id="t"></span></div>
<script src="plugin-blur.js"></script>
</body>
</html>
